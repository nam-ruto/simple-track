<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Job Tracker{% endblock %}</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

  <style>
    body {
      background-color: #f0f2f5;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    /* Navbar */
    .navbar-brand {
      font-weight: 700;
      font-size: 1.3rem;
      letter-spacing: -0.3px;
    }

    /* Kanban board */
    .kanban-board {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      padding-bottom: 1rem;
      align-items: flex-start;
    }

    .kanban-column {
      flex: 0 0 290px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 220px);
    }

    .kanban-column-header {
      padding: 1rem 1rem 0.75rem;
      border-radius: 12px 12px 0 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .kanban-column-body {
      padding: 0.75rem;
      overflow-y: auto;
      flex: 1;
    }

    /* Cards */
    .app-card {
      background: #fff;
      border: 1px solid #e8eaed;
      border-radius: 10px;
      padding: 0.875rem;
      margin-bottom: 0.625rem;
      cursor: pointer;
      transition: box-shadow 0.15s, transform 0.15s;
      position: relative;
    }

    .app-card:hover {
      box-shadow: 0 4px 12px rgba(0,0,0,.12);
      transform: translateY(-1px);
    }

    .app-card .job-title {
      font-weight: 600;
      font-size: 0.9rem;
      color: #1a1a2e;
      margin-bottom: 0.2rem;
      line-height: 1.3;
    }

    .app-card .company-name {
      font-size: 0.82rem;
      color: #5f6368;
      margin-bottom: 0.5rem;
    }

    .app-card .meta-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.78rem;
      color: #80868b;
      margin-bottom: 0.15rem;
    }

    .app-card .card-actions {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.75rem;
      padding-top: 0.6rem;
      border-top: 1px solid #f1f3f4;
    }

    /* Column color strips */
    .col-primary .kanban-column-header  { background: #e8f0fe; }
    .col-warning .kanban-column-header  { background: #fef9e7; }
    .col-success .kanban-column-header  { background: #e6f4ea; }
    .col-danger  .kanban-column-header  { background: #fce8e6; }

    /* Stats bar */
    .stats-card {
      border: none;
      border-radius: 12px;
      transition: box-shadow 0.15s;
    }
    .stats-card:hover {
      box-shadow: 0 4px 12px rgba(0,0,0,.1);
    }

    /* Toast / alerts */
    .alert {
      border: none;
      border-radius: 10px;
    }

    /* Scrollbar styling */
    .kanban-column-body::-webkit-scrollbar,
    .kanban-board::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .kanban-column-body::-webkit-scrollbar-track,
    .kanban-board::-webkit-scrollbar-track {
      background: transparent;
    }
    .kanban-column-body::-webkit-scrollbar-thumb,
    .kanban-board::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 99px;
    }

    /* Form page */
    .form-page-card {
      border: none;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    {% block extra_css %}{% endblock %}
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container-fluid px-4">
      <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'application_list' %}">
        <i class="bi bi-kanban-fill text-primary"></i>
        Job Tracker
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="{% url 'application_list' %}">
              <i class="bi bi-kanban me-1"></i>Board
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'application_create' %}">
              <i class="bi bi-plus-circle me-1"></i>Add Application
            </a>
          </li>
        </ul>

        {% if user.is_authenticated %}
        <ul class="navbar-nav ms-auto align-items-center gap-2">
          <li class="nav-item">
            <span class="navbar-text text-secondary small">
              <i class="bi bi-person-circle me-1"></i>{{ user.username }}
            </span>
          </li>
          <li class="nav-item">
            <form method="post" action="{% url 'logout' %}" class="d-inline">
              {% csrf_token %}
              <button type="submit" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-box-arrow-right me-1"></i>Logout
              </button>
            </form>
          </li>
        </ul>
        {% endif %}
      </div>
    </div>
  </nav>

  <!-- Flash messages -->
  {% if messages %}
  <div class="container-fluid px-4 pt-3">
    {% for message in messages %}
    <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show d-flex align-items-center gap-2" role="alert">
      <i class="bi bi-check-circle-fill"></i>
      <span>{{ message }}</span>
      <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
  </div>
  {% endif %}

  <!-- Page content -->
  <main class="container-fluid px-4 py-3">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
