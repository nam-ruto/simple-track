{% extends "applications/base.html" %}

{% block title %}Delete Application — Job Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-8 col-md-5">
    <div class="card form-page-card text-center">
      <div class="card-body p-5">
        <i class="bi bi-trash3-fill text-danger" style="font-size: 3rem;"></i>
        <h5 class="fw-bold mt-3 mb-1">Delete Application?</h5>
        <p class="text-muted mb-4">
          You are about to delete <strong>{{ application.job_title }}</strong> at <strong>{{ application.company }}</strong>.
          This cannot be undone.
        </p>
        <div class="d-flex gap-2 justify-content-center">
          <a href="{% url 'application_list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
          <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger px-4">
              <i class="bi bi-trash me-1"></i>Yes, Delete
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
