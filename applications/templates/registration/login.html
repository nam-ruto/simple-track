<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Job Tracker</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

  <style>
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .login-card {
      border: none;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
      width: 100%;
      max-width: 400px;
    }

    .login-header {
      background: linear-gradient(135deg, #0d6efd, #0a58ca);
      border-radius: 20px 20px 0 0;
      padding: 2.5rem 2rem 2rem;
      text-align: center;
      color: white;
    }

    .login-body {
      padding: 2rem;
    }

    .form-control {
      border-radius: 10px;
      padding: 0.65rem 0.9rem;
      border-color: #dee2e6;
    }

    .form-control:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
    }

    .btn-login {
      border-radius: 10px;
      padding: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>

  <div class="login-card card">
    <!-- Header -->
    <div class="login-header">
      <i class="bi bi-kanban-fill" style="font-size: 2.5rem;"></i>
      <h4 class="mt-2 mb-0 fw-bold">Job Tracker</h4>
      <p class="mb-0 opacity-75 small mt-1">Track your applications, land your dream job</p>
    </div>

    <!-- Body -->
    <div class="login-body">
      <h6 class="fw-semibold mb-3 text-center text-muted">Sign in to your account</h6>

      {% if form.errors %}
      <div class="alert alert-danger alert-sm d-flex align-items-center gap-2 py-2 border-0 rounded-3 mb-3">
        <i class="bi bi-x-circle-fill"></i>
        <small>Invalid username or password. Please try again.</small>
      </div>
      {% endif %}

      <form method="post">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label fw-semibold small">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 rounded-start-3">
              <i class="bi bi-person text-muted"></i>
            </span>
            <input type="text" name="username" class="form-control border-start-0 rounded-end-3"
                   placeholder="Enter your username" autofocus required />
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold small">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 rounded-start-3">
              <i class="bi bi-lock text-muted"></i>
            </span>
            <input type="password" name="password" class="form-control border-start-0 rounded-end-3"
                   placeholder="Enter your password" required />
          </div>
        </div>

        <input type="hidden" name="next" value="{{ next }}" />

        <button type="submit" class="btn btn-primary w-100 btn-login">
          <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>
      </form>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
